# pnpm settings (no workspace packages). pnpm writes some of these itself.

# Install scripts stay off: esbuild ships its binary through optional dependencies, sharp its
# prebuilt libvips the same way.
allowBuilds:
  esbuild: false

# The image ships node_modules for linux/amd64 and linux/arm64 (the local k3d cluster); sharp's
# prebuilt binaries are optional dependencies per platform.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [glibc]

shellEmulator: true
trustPolicy: no-downgrade
# semver 6.3.1 was published without provenance after 7.x had it; same exclusion as nothingeats-ui.
trustPolicyExclude:
  - semver@6.3.1
