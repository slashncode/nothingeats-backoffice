# pnpm settings (no workspace packages). pnpm writes some of these itself.

# Install scripts stay off: esbuild ships its binary through optional dependencies, sharp its
# prebuilt libvips the same way.
allowBuilds:
  esbuild: false

# The image ships node_modules for linux/amd64 and linux/arm64 (the local k3d cluster); sharp's
# prebuilt binaries are optional dependencies per platform.
supportedArchitectures:
  os: [current, linux]
  cpu: [current, x64, arm64]
  libc: [glibc]

shellEmulator: true
trustPolicy: no-downgrade
# semver 6.3.1 was published without provenance after 7.x had it; same exclusion as nothingeats-ui.
trustPolicyExclude:
  - semver@6.3.1
patchedDependencies:
  '@payloadcms/drizzle@4.0.0-beta.6': patches/@payloadcms__drizzle@4.0.0-beta.6.patch

# Security fixes below what Payload 4's beta pins. Drop each once Payload's own range includes it.
overrides:
  # monaco-editor (Payload's code fields) pins dompurify 3.4.15: several XSS advisories, fixed in 3.4.17.
  dompurify@<3.4.17: 3.4.17
  # drizzle-kit loads its config through @esbuild-kit, which wants esbuild 0.18 (dev-server advisory).
  esbuild@<0.25.0: 0.25.12
