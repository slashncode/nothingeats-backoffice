# pnpm settings (no workspace packages). pnpm writes some of these itself.

# Install scripts stay off: esbuild ships its binary through optional dependencies, sharp its
# prebuilt libvips the same way.
allowBuilds:
  esbuild: false

shellEmulator: true
trustPolicy: no-downgrade
# semver 6.3.1 was published without provenance after 7.x had it; same exclusion as nothingeats-ui.
trustPolicyExclude:
  - semver@6.3.1
